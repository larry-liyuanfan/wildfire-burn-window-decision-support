name: quality

on:
  pull_request:
  push:
    branches:
      - main
      - agent/**
      - codex/**

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev,serve]"
      - name: Test
        run: python -m pytest
      - name: Lint
        run: python -m ruff check .
      - name: Type check trusted-tool boundary
        run: >-
          python -m mypy
          src/burnwindows/models.py
          src/burnwindows/service.py
          src/burnwindows/tool_benchmark.py
      - name: Strict type check burn-ID climatology core
        run: python -m mypy --strict src/burnwindows/burn_unit_climatology.py
