[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "burn-window-decision-support"
version = "0.1.0"
description = "Deterministic prescribed-burn window tools for agentic decision support"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary - portfolio source pending data and prescription licensing review" }
authors = [{ name = "Larry Fan" }]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "pydantic>=2.7",
  "xarray>=2024.6",
  "dask[array,distributed]>=2024.6",
  "openpyxl>=3.1",
  "h5netcdf>=1.3",
  "h5py>=3.11",
  "shapely>=2.0",
  "pyproj>=3.6",
]

[project.optional-dependencies]
milp = ["scipy>=1.13"]
kerchunk = ["fsspec>=2024.6", "zarr>=2.18", "kerchunk>=0.2.7"]
public-data = ["fsspec>=2024.6", "gcsfs>=2024.6", "zarr>=3.1"]
serve = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27"]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "mypy>=1.11",
  "psutil>=5.9",
  "scipy>=1.13",
]

[project.scripts]
burn-window = "burnwindows.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/burnwindows"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
follow_imports = "skip"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
